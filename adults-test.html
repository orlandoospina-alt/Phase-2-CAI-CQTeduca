<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Picture - Corporate ESL Placement Exam</title>
    <style>
        /* CSS3: Corporate / Modern Lifestyle Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --bg-body: #F4F7F9;
            --bg-sidebar: #0B1B3D; /* Deep Navy */
            --bg-sidebar-hover: #162C5B;
            --text-main: #333333; /* Charcoal */
            --text-light: #7A8B99;
            --text-sidebar: #E2E8F0;
            --accent-blue: #0056B3; /* Corporate Blue */
            --accent-gold: #D4AF37; /* Professional Gold */
            --white: #FFFFFF;
            --border-light: #E0E6ED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR NAVIGATION */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-header h1 {
            color: var(--white);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-header p {
            color: var(--accent-gold);
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .nav-books {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-units {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        /* Scrollbar for sidebar */
        .nav-units::-webkit-scrollbar { width: 6px; }
        .nav-units::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }

        .btn {
            background: transparent;
            color: var(--text-sidebar);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--bg-sidebar-hover);
        }

        .btn-book {
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-book.active {
            background-color: var(--accent-blue);
            color: var(--white);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
        }

        .btn-unit {
            padding: 10px 15px;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
            border-radius: 0 6px 6px 0;
        }

        .btn-unit.active {
            background-color: rgba(255,255,255,0.05);
            border-left-color: var(--accent-gold);
            color: var(--white);
            font-weight: 700;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--bg-body);
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            display: none;
        }

        /* HEADER & CEFR TRACEABILITY */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .traceability-badge {
            background-color: var(--bg-sidebar);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .cefr-badge {
            background-color: var(--accent-gold);
            color: var(--bg-sidebar);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .unit-title {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--bg-sidebar);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 15px;
        }

        .hero-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* GREETING BANNER */
        .greeting-banner {
            background-color: var(--bg-sidebar);
            color: var(--white);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .greeting-banner strong { 
            color: var(--accent-gold); 
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TASK CARDS */
        .task-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid;
        }

        .card.speaking { border-top-color: var(--accent-blue); }
        .card.writing { border-top-color: var(--accent-gold); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .speaking .card-header { color: var(--accent-blue); }
        .writing .card-header { color: var(--accent-gold); }

        .task-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        .task-content p { margin-bottom: 15px; }
        .task-content ul { margin-left: 20px; margin-bottom: 15px; }
        .task-content li { margin-bottom: 8px; }

        /* Highlight classes for teacher & student conversational flow */
        .warmup-bubble {
            background-color: #EBF3FB;
            border-left: 4px solid var(--accent-blue);
            padding: 14px 18px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 15px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .warmup-bubble strong {
            color: var(--accent-blue);
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .maintask-bubble {
            background-color: #FDF8E2;
            border-left: 4px solid var(--accent-gold);
            padding: 14px 18px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 15px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .maintask-bubble strong {
            color: #997A15;
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .evaluator-notes {
            background-color: #F8FAFC;
            border-left: 3px solid var(--text-light);
            padding: 15px;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #555;
            border-radius: 0 4px 4px 0;
        }

        .evaluator-notes strong { color: var(--bg-sidebar); }

        .word-count {
            display: inline-block;
            background-color: #FFF9E6;
            color: #B8860B;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 10px;
            border: 1px solid #F0E6D2;
        }

        /* Responsive */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; box-shadow: none; }
            .nav-books { flex-direction: row; overflow-x: auto; white-space: nowrap; padding: 10px; }
            .nav-units { flex-direction: row; overflow-x: auto; max-height: 70px; padding: 10px; border-bottom: 1px solid var(--border-light); }
            .btn-unit { border-left: none; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; }
            .btn-unit.active { border-left: none; border-bottom-color: var(--accent-gold); }
            .main-content { padding: 20px; }
            .hero-img { height: 200px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>The Big Picture</h1>
            <p>Corporate Placement Exam</p>
        </div>
        <div class="nav-books" id="book-nav"></div>
        <div class="nav-units" id="unit-nav"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="dashboard-container" id="dashboard">
            <div class="header-meta">
                <span class="traceability-badge" id="trace-badge">Book 1 > Unit 1</span>
                <span class="cefr-badge" id="cefr-badge">CEFR A1</span>
            </div>
            
            <h2 class="unit-title" id="unit-title">Welcome</h2>
            <img id="unit-hero" class="hero-img" src="" alt="Corporate Theme">

            <!-- GREETING BLOCK -->
            <div class="greeting-banner" id="greeting-content"></div>

            <div class="task-grid">
                <!-- WRITING TASK -->
                <div class="card writing">
                    <div class="card-header">✉️ Written Expression Task</div>
                    <div class="task-content" id="write-content"></div>
                </div>

                <!-- SPEAKING TASK -->
                <div class="card speaking">
                    <div class="card-header">🗣️ Professional Interaction (Speaking)</div>
                    <div class="task-content" id="speak-content"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // STANDARD GREETING FOR ALL UNITS (Neutral, Time-Independent)
        const stdGreeting = "Welcome! On behalf of Comfenalco Quindío, it is a pleasure to welcome you to Instituto Comfenalco. I will be your examiner today and it is a pleasure to meet you. Let's start our conversation...";

        // CURRICULUM DATA (Books 1-5, with unique non-repeated writing prompts per unit, speaking prompts untouched)
        const curriculum = {
            "Book 1 (Breakthrough)": {
                level: "A1",
                units: [
                    { u: 1, title: "Welcome!", img: "https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's start with some very basic personal details: Could you tell me your full name, and would you mind spelling your first name for me?",
                      mt: "Thank you. Now, speaking of names and backgrounds, where are you from originally, and what is your nationality?",
                      w: "Write a short message to introduce yourself: state your full name, spell your last name, and specify your nationality and city of residence.",
                      e: "Check basic greetings, 'to be' verb, and numbers/spelling for contact info." },
                    { u: 2, title: "At Work", img: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about what you do every day. Do you currently have a job, or are you a student at the moment?",
                      mt: "Since you mentioned you are a [worker/student], could you describe your typical workplace or study space? What are some of the common objects you have around you on your desk?",
                      w: "Write a short paragraph about your current job or studies. List three common objects you use in your workspace using possessive adjectives (my, your, our).",
                      e: "Assess vocabulary for office objects and possessive adjectives (my, his, our)." },
                    { u: 3, title: "At Home", img: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "I'd like to know a bit about where you live. Do you live in a house or an apartment, and which is your favorite room there?",
                      mt: "Speaking of your home, could you describe what it looks like and tell me about the family members or roommates you share it with?",
                      w: "Write a short paragraph describing your home or apartment, mentioning your favorite room and the people you live with.",
                      e: "Evaluate adjective placement (a big house) and basic family vocabulary." },
                    { u: 4, title: "The Good Things in Life", img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about things you enjoy. What do you usually like to do in your free time when you want to relax?",
                      mt: "That sounds lovely. Can you tell me about a specific hobby or leisure activity that you practice regularly, and explain why you like it so much?",
                      w: "Write about your favorite leisure activities. Describe two things you like to do on weekends and what items (objects) you need for them.",
                      e: "Check functional language for buying/ordering and basic transactional interactions." },
                    { u: 5, title: "A Day in My Life", img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's discuss how you organize your days. Which day of the week is your favorite day, and what do you normally do then?",
                      mt: "Thinking about your normal schedule, can you walk me through your typical daily routine on a workday? What times do you usually start and finish your main activities?",
                      w: "Write down your typical Monday schedule. Specify what time you wake up, start your main activities, and finish work or study.",
                      e: "Assess Present Simple for routines and adverbs of frequency (usually, always)." },
                    { u: 6, title: "Places to Go", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about your local city or town. What is your favorite public place to visit when you go out, like a park, a mall, or a square?",
                      mt: "Since you like that area, if a visitor comes to your neighborhood for the first time, what interesting places are there to see nearby, and where are they located?",
                      w: "Write a short note describing two interesting places in your neighborhood (e.g., a park or café) and state where they are located using prepositions of place.",
                      e: "Evaluate 'There is/are', prepositions of place, and basic directions." },
                    { u: 7, title: "Communication", img: "https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "To start, let's talk about the weather today. What is the weather like outside right now, and do you prefer hot or cold days?",
                      mt: "Weather can really affect our daily activities. Apart from learning English, what is a major project, class, or work task you are actively working on at this exact point in your life?",
                      w: "Write about what you and your family members are doing right now. Describe the current weather and your ongoing activities using the Present Continuous tense.",
                      e: "Check Present Continuous for actions happening at the moment." },
                    { u: 8, title: "A Big Day", img: "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about personal celebrations. When is your birthday, and how do you usually celebrate it?",
                      mt: "Birthdays are always great milestones. Can you tell me about a past birthday celebration, or a particularly special day in your past that you remember very well?",
                      w: "Write about a memorable day from your past. State where you went, who you were with, and what you did using simple past verbs (e.g., went, saw, had).",
                      e: "Assess Past Simple of regular and common irregular verbs (went, had)." },
                    { u: 9, title: "A Work of Art", img: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about media and entertainment. What kind of movies, TV shows, or music do you usually enjoy when you are at home?",
                      mt: "Thinking about those interests, can you tell me about a film, a book, or a song that made a strong impression on you in the past? What was it about, and how did it make you feel?",
                      w: "Write a short review of a movie or book you experienced last year. Include past time expressions and simple descriptive adjectives.",
                      e: "Evaluate past time expressions (yesterday, last year) and descriptive vocabulary." },
                    { u: 10, title: "Going Out", img: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about your social life. What do you usually like to do when you go out to relax with your friends or family?",
                      mt: "Going out is a great way to recharge. What are your specific plans for this coming weekend? Who are you going to see, and what activities can you do together?",
                      w: "Write an email to a friend inviting them out for the upcoming weekend. Detail your specific plans and ask if they can join you.",
                      e: "Check functional language for invitations and future arrangements." }
                ]
            },
            "Book 2 (Waystage)": {
                level: "A2",
                units: [
                    { u: 1, title: "One World", img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "To start our conversation, let's talk about travel. What country or city would you like to visit one day, and why?",
                      mt: "Traveling is a great way to see the world. Now, could you introduce yourself to me in detail and tell me about one or two personal possessions that you always take with you when you travel?",
                      w: "Write a personal profile entry introducing your background and describing two valuable personal possessions you always carry when traveling abroad.",
                      e: "Check extended self-introductions and descriptive adjectives." },
                    { u: 2, title: "My Life", img: "https://images.unsplash.com/photo-1573164713714-d95e436ab8d6?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about your personal interests. What are some of your favorite hobbies that you practice regularly in your daily life?",
                      mt: "It's great to have dedicated hobbies. Could you tell me how you first got interested in those activities, and tell me if anyone in your family shares these same interests?",
                      w: "Write about your family background and your regular hobbies. Specify how often you practice your favorite outdoor activities using frequency adverbs.",
                      e: "Assess fluency in discussing routines and family relationships." },
                    { u: 3, title: "Days of Our Lives", img: "https://images.unsplash.com/photo-1506784951206-b9623471d471?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about your weekends. Can you describe what a typical Saturday looks like for you from morning to night?",
                      mt: "Saturdays are perfect for socializing. When you want to suggest a weekend plan to your friends or family, what do you usually suggest, and how do you convince them to join you?",
                      w: "Write a short message to a group of friends outlining a suggested itinerary for a fun Saturday outing, making use of suggestions like 'Let's' or 'How about'.",
                      e: "Evaluate making suggestions (Let's, How about) and expressing enthusiasm." },
                    { u: 4, title: "Home Life", img: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "I'd like to ask you about your neighborhood. What is the area where you currently live like? Are there many stores, restaurants, or parks nearby?",
                      mt: "Neighborhoods really shape our lifestyle. If you could design your absolute ideal home, what rooms and furniture would it have, and where would it be located?",
                      w: "Write a description of your current neighborhood and explain how to get from your home to the nearest grocery store or transit station.",
                      e: "Check asking for information and giving complex directions." },
                    { u: 5, title: "Shopping Around", img: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about shopping. Do you enjoy shopping for clothes, and do you prefer online shopping or physical stores?",
                      mt: "Shopping choices often reflect who we are. How would you describe your personal style, and how do the clothes you are wearing today compare to what you wear for work or formal events?",
                      w: "Write a short post describing your personal fashion style. Contrast the casual clothes you like to wear at home with the professional attire required for work.",
                      e: "Assess vocabulary for clothing and giving opinions." },
                    { u: 6, title: "The Great Outdoors", img: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about active lifestyles. Do you prefer spending your free time indoors at home or outdoors in nature? Why?",
                      mt: "Being outdoors often goes hand-in-hand with physical activity. Do you enjoy playing or watching sports? What are some physical activities you are good at, and which ones do you dislike?",
                      w: "Write a short opinion post stating whether you love or hate outdoor sports, explaining your reasons and how often you practice them.",
                      e: "Check giving reasons and organizing plans via text/chat formats." },
                    { u: 7, title: "On the Move", img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about transportation. What is your favorite way to travel when you go on a long trip: by car, bus, or plane? Why?",
                      mt: "Each mode of transport offers a different experience. Could you tell me about the last time you traveled somewhere on vacation? Where did you go, how did you get there, and what did you do?",
                      w: "Write a short travel log entry about your last vacation: state where you went, how you traveled there, who accompanied you, and your primary activities.",
                      e: "Evaluate narrative sequencing in the past." },
                    { u: 8, title: "In the News", img: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about sharing news with others. What is some good news you received recently from a friend or a family member, and how did you feel?",
                      mt: "Good news often marks important moments. Can you tell me about a major life stage or milestone you experienced in your past, and explain how it changed your life?",
                      w: "Write an email to a friend sharing some exciting personal news or a recent milestone, and express how it made you feel.",
                      e: "Check functional language for reacting to news (That's great! Oh no!)." },
                    { u: 9, title: "Food Matters", img: "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about food. What is your favorite meal of the day, and what do you usually eat for it?",
                      mt: "Our food choices are closely linked to our health. In your opinion, what should a person eat and do to maintain a healthy lifestyle, and what advice would you give to someone who wants to eat better?",
                      w: "Write three practical nutrition tips for a healthy lifestyle, using quantifiers (some, any, much, many) and food vocabulary.",
                      e: "Assess food vocabulary and quantifiers (some, any, much, many)." },
                    { u: 10, title: "Technology", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about daily tools. What electronic devices or mobile apps do you find absolutely essential in your daily life?",
                      mt: "Technology has developed so rapidly. How do you think your current smartphone or computer compares to older models you owned in the past? What technology are you going to buy next?",
                      w: "Write a short paragraph comparing your current computer or phone with older models, and state what electronic gadget you plan to buy next.",
                      e: "Check comparatives/superlatives and 'going to' for future plans." },
                    { u: 11, title: "A Working Life", img: "https://images.unsplash.com/photo-1573164574572-cb89e39749b4?auto=format&fit=crop&w=800&q=80",
                      g: stdGreeting,
                      wu: "Let's talk about career choices. What jobs did you find interesting when you were younger, and what do you think of them now?",
                      mt: "Careers often bring specific daily routines. What are your current responsibilities at work or in your studies? What tasks do you have to do every day, and which ones don't you have to do?",
                      w: "Write about your daily professional or academic obligations. Detail what tasks you have to complete daily and what duties you don't have to worry about.",
                      e: "Evaluate professional register, requests, and offers (Can I help? Would you like?)." },

        const bookNav = document.getElementById('book-nav');
        const unitNav = document.getElementById('unit-nav');
        const dashboard = document.getElementById('dashboard');
        
        let currentBookStr = Object.keys(curriculum)[0];

        function init() {
            Object.keys(curriculum).forEach((bookName, index) => {
                const btn = document.createElement('button');
                btn.className = `btn btn-book ${index === 0 ? 'active' : ''}`;
                btn.innerText = bookName;
                btn.onclick = () => selectBook(bookName, btn);
                bookNav.appendChild(btn);
            });
            renderUnits(currentBookStr);
        }

        function selectBook(bookName, btnElement) {
            currentBookStr = bookName;
            document.querySelectorAll('.btn-book').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderUnits(bookName);
        }

        function renderUnits(bookName) {
            unitNav.innerHTML = '';
            dashboard.style.display = 'none';

            curriculum[bookName].units.forEach((unitData, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-unit';
                btn.innerText = `Unit ${unitData.u}: ${unitData.title}`;
                btn.onclick = () => displayUnit(unitData, btn, bookName);
                unitNav.appendChild(btn);
                
                if(index === 0) displayUnit(unitData, btn, bookName);
            });
        }

        function displayUnit(data, btnElement, bookName) {
            document.querySelectorAll('.btn-unit').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const cefrLevel = curriculum[bookName].level;

            // Header Meta
            document.getElementById('trace-badge').innerText = `${bookName} > Unit ${data.u}`;
            document.getElementById('cefr-badge').innerText = `CEFR ${cefrLevel}`;
            document.getElementById('unit-title').innerText = data.title;
            document.getElementById('unit-hero').src = data.img;

            // Greeting (Universal for both tasks)
            document.getElementById('greeting-content').innerHTML = `
                <strong>🤝 Welcome & Introduction</strong>
                "${data.g}"
            `;

            // Speaking (Divided into Warm-Up and Main Task)
            document.getElementById('speak-content').innerHTML = `
                <div class="warmup-bubble">
                    <strong>☕ 1. Introductory Warm-up</strong>
                    "${data.wu}"
                </div>
                <div class="maintask-bubble">
                    <strong>🎯 2. Main Evaluative Task</strong>
                    "${data.mt}"
                </div>
                <div class="evaluator-notes">
                    <strong>👨‍💼 Evaluator Focus:</strong> ${data.e}
                </div>
            `;

            // Writing (Free writing instructions instead of word count)
            document.getElementById('write-content').innerHTML = `
                <p><strong>Task:</strong> ${data.w}</p>
                <div class="word-count">⏱️ Time Limit: 10 Minutes (Free Writing)</div>
            `;

            dashboard.style.display = 'block';
        }

        window.onload = init;
    </script>
</body>
</html>
