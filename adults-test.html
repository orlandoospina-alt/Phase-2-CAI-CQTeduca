<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Picture - Corporate ESL Placement Exam</title>
    <style>
        /* CSS3: Corporate / Modern Lifestyle Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --bg-body: #F4F7F9;
            --bg-sidebar: #0B1B3D; /* Deep Navy */
            --bg-sidebar-hover: #162C5B;
            --text-main: #333333; /* Charcoal */
            --text-light: #7A8B99;
            --text-sidebar: #E2E8F0;
            --accent-blue: #0056B3; /* Corporate Blue */
            --accent-gold: #D4AF37; /* Professional Gold */
            --white: #FFFFFF;
            --border-light: #E0E6ED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR NAVIGATION */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-header h1 {
            color: var(--white);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-header p {
            color: var(--accent-gold);
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .nav-books {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-units {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        /* Scrollbar for sidebar */
        .nav-units::-webkit-scrollbar { width: 6px; }
        .nav-units::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }

        .btn {
            background: transparent;
            color: var(--text-sidebar);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--bg-sidebar-hover);
        }

        .btn-book {
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-book.active {
            background-color: var(--accent-blue);
            color: var(--white);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
        }

        .btn-unit {
            padding: 10px 15px;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
            border-radius: 0 6px 6px 0;
        }

        .btn-unit.active {
            background-color: rgba(255,255,255,0.05);
            border-left-color: var(--accent-gold);
            color: var(--white);
            font-weight: 700;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--bg-body);
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            display: none;
        }

        /* HEADER & CEFR TRACEABILITY */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .traceability-badge {
            background-color: var(--bg-sidebar);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .cefr-badge {
            background-color: var(--accent-gold);
            color: var(--bg-sidebar);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .unit-title {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--bg-sidebar);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 15px;
        }

        .hero-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* TASK CARDS */
        .task-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid;
        }

        .card.speaking { border-top-color: var(--accent-blue); }
        .card.writing { border-top-color: var(--accent-gold); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .speaking .card-header { color: var(--accent-blue); }
        .writing .card-header { color: var(--accent-gold); }

        .task-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        .task-content p { margin-bottom: 15px; }

        .evaluator-notes {
            background-color: #F8FAFC;
            border-left: 3px solid var(--text-light);
            padding: 15px;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #555;
            border-radius: 0 4px 4px 0;
        }

        .evaluator-notes strong { color: var(--bg-sidebar); }

        .word-count {
            display: inline-block;
            background-color: #FFF9E6;
            color: #B8860B;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 10px;
            border: 1px solid #F0E6D2;
        }

        /* Responsive */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; box-shadow: none; }
            .nav-books { flex-direction: row; overflow-x: auto; white-space: nowrap; padding: 10px; }
            .nav-units { flex-direction: row; overflow-x: auto; max-height: 70px; padding: 10px; border-bottom: 1px solid var(--border-light); }
            .btn-unit { border-left: none; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; }
            .btn-unit.active { border-left: none; border-bottom-color: var(--accent-gold); }
            .main-content { padding: 20px; }
            .hero-img { height: 200px; }
        }
    </style>
</head>

        const bookNav = document.getElementById('book-nav');
        const unitNav = document.getElementById('unit-nav');
        const dashboard = document.getElementById('dashboard');
        
        let currentBookStr = Object.keys(curriculum)[0];

        function init() {
            Object.keys(curriculum).forEach((bookName, index) => {
                const btn = document.createElement('button');
                btn.className = `btn btn-book ${index === 0 ? 'active' : ''}`;
                btn.innerText = bookName;
                btn.onclick = () => selectBook(bookName, btn);
                bookNav.appendChild(btn);
            });
            renderUnits(currentBookStr);
        }

        function selectBook(bookName, btnElement) {
            currentBookStr = bookName;
            document.querySelectorAll('.btn-book').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderUnits(bookName);
        }

        function renderUnits(bookName) {
            unitNav.innerHTML = '';
            dashboard.style.display = 'none';

            curriculum[bookName].units.forEach((unitData, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-unit';
                btn.innerText = `Unit ${unitData.u}: ${unitData.title}`;
                btn.onclick = () => displayUnit(unitData, btn, bookName);
                unitNav.appendChild(btn);
                
                if(index === 0) displayUnit(unitData, btn, bookName);
            });
        }

        function displayUnit(data, btnElement, bookName) {
            document.querySelectorAll('.btn-unit').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const cefrLevel = curriculum[bookName].level;

            // Header Meta
            document.getElementById('trace-badge').innerText = `${bookName} > Unit ${data.u}`;
            document.getElementById('cefr-badge').innerText = `CEFR ${cefrLevel}`;
            document.getElementById('unit-title').innerText = data.title;
            document.getElementById('unit-hero').src = data.img;

            // Speaking
            document.getElementById('speak-content').innerHTML = `
                <p><strong>Prompt:</strong> ${data.s}</p>
                <div class="evaluator-notes">
                    <strong>👨‍💼 Evaluator Focus:</strong> ${data.e}
                </div>
            `;

            // Writing
            document.getElementById('write-content').innerHTML = `
                <p><strong>Task:</strong> ${data.w}</p>
                <div class="word-count">📋 Target: ${data.wc}</div>
            `;

            dashboard.style.display = 'block';
        }

        window.onload = init;
    </script>
</body>
