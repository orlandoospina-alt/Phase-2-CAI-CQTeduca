<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now You - Teen ESL Placement Exam</title>
    <style>
        /* CSS3 STYLES: Urban / Dark Mode / Neon Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-light: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-cyan: #22d3ee;
            --neon-cyan-glow: rgba(34, 211, 238, 0.4);
            --neon-pink: #f472b6;
            --neon-pink-glow: rgba(244, 114, 182, 0.4);
            --neon-purple: #c084fc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* DASHBOARD LAYOUT */
        .sidebar {
            width: 300px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan-glow);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-header p {
            color: var(--neon-pink);
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: 600;
        }

        .nav-books {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-units {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            border-color: var(--neon-purple);
            color: var(--text-main);
        }

        .btn-book.active {
            background-color: rgba(192, 132, 252, 0.1);
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.2);
        }

        .btn-unit.active {
            background-color: rgba(34, 211, 238, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }

        .feed-container {
            max-width: 800px;
            margin: 0 auto;
            display: none; /* Hidden until loaded */
        }

        .traceability-badge {
            display: inline-block;
            background-color: var(--bg-surface-light);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .unit-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .hero-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* CARDS / TASKS */
        .card {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }

        .card.speaking::before { background-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
        .card.writing::before { background-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .speaking .card-header { color: var(--neon-cyan); }
        .writing .card-header { color: var(--neon-pink); }

        /* CONTENT FORMATTING */
        .task-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .q-list {
            list-style: none;
            margin-bottom: 20px;
        }
        
        .q-list li {
            margin-bottom: 12px;
            padding-left: 28px;
            position: relative;
        }

        .q-list li::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: var(--neon-cyan);
            font-size: 0.9rem;
            top: 3px;
        }

        .teacher-notes {
            background-color: rgba(34, 211, 238, 0.05);
            border: 1px solid var(--neon-cyan-glow);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .teacher-notes strong { color: var(--neon-cyan); }

        .write-split {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .write-text { flex: 1; }
        
        .write-img-container {
            flex: 0 0 300px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            position: relative;
        }

        .write-img-container::after {
            content: '📸 IG Post';
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }

        .write-img-container img {
            width: 100%;
            display: block;
            object-fit: cover;
            height: 250px;
        }

        .word-count-badge {
            display: inline-block;
            background-color: rgba(244, 114, 182, 0.15);
            color: var(--neon-pink);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
            border: 1px solid var(--neon-pink-glow);
        }

        .example-quote {
            display: block;
            margin-top: 15px;
            padding: 12px 15px;
            background-color: var(--bg-surface-light);
            border-left: 3px solid var(--neon-pink);
            font-style: italic;
            color: #e2e8f0;
            border-radius: 0 8px 8px 0;
        }

        /* Mobile Response */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 2px solid var(--border-color); }
            .nav-books { flex-direction: row; overflow-x: auto; white-space: nowrap; }
            .nav-units { flex-direction: row; overflow-x: auto; max-height: 80px; }
            .main-content { padding: 20px; }
            .write-split { flex-direction: column; }
            .write-img-container { flex: auto; width: 100%; }
        }
    </style>
</head>

        // DOM Elements
        const bookNav = document.getElementById('book-nav');
        const unitNav = document.getElementById('unit-nav');
        const feedContainer = document.getElementById('feed-container');
        
        let currentBookStr = Object.keys(curriculum)[0];

        function init() {
            // Render Book buttons
            Object.keys(curriculum).forEach((bookName, index) => {
                const btn = document.createElement('button');
                btn.className = `btn btn-book ${index === 0 ? 'active' : ''}`;
                btn.innerText = bookName;
                btn.onclick = () => selectBook(bookName, btn);
                bookNav.appendChild(btn);
            });
            
            // Load first book's units initially
            renderUnits(currentBookStr);
        }

        function selectBook(bookName, btnElement) {
            currentBookStr = bookName;
            document.querySelectorAll('.btn-book').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderUnits(bookName);
        }

        function renderUnits(bookName) {
            unitNav.innerHTML = '';
            feedContainer.style.display = 'none';

            curriculum[bookName].forEach((unitData, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-unit';
                btn.innerText = `Unit ${unitData.unit}: ${unitData.topic}`;
                btn.onclick = () => displayUnit(unitData, btn, bookName);
                unitNav.appendChild(btn);
                
                // Auto-click the first unit when changing books
                if(index === 0) {
                    displayUnit(unitData, btn, bookName);
                }
            });
        }

        function displayUnit(data, btnElement, bookName) {
            document.querySelectorAll('.btn-unit').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // Header Elements
            document.getElementById('trace-badge').innerText = `${bookName} > Unit ${data.unit}`;
            document.getElementById('unit-title').innerText = data.topic;
            document.getElementById('unit-hero').src = data.hero;

            // Speaking (The Mic is On)
            let speakHTML = `<ul class="q-list">`;
            data.sQ.forEach(q => speakHTML += `<li>${q}</li>`);
            speakHTML += `</ul>
                          <div class="teacher-notes">
                              <strong>👨‍🏫 Evaluator Note:</strong> ${data.sT}
                          </div>`;
            document.getElementById('speak-content').innerHTML = speakHTML;

            // Writing (The Feed)
            let writeHTML = `
                <div class="write-split">
                    <div class="write-text">
                        <p>${data.wP}</p>
                        <span class="word-count-badge">🎯 Word Count Target: ${data.wC}</span>
                        <span class="example-quote">Example: ${data.wE}</span>
                    </div>
                    <div class="write-img-container">
                        <img src="${data.wImg}" alt="Visual prompt for writing task">
                    </div>
                </div>
            `;
            document.getElementById('write-content').innerHTML = writeHTML;

            // Show UI
            feedContainer.style.display = 'block';
        }

        // Initialize App
        window.onload = init;
    </script>
